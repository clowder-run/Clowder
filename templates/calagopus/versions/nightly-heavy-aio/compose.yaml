services:
    calagopus:
        image: ghcr.io/calagopus/panel:nightly-heavy-aio
        pull_policy: always
        restart: unless-stopped
        stop_grace_period: 40s
        x-ports:
            - ${CALAGOPUS_HOST}:8000/https
            - ${CALAGOPUS_SFTP_PORT}:2022/tcp@host
        environment:
            TZ: ${TZ}
            PORT: "8000"
            DATABASE_URL: ${DATABASE_URL}
            DATABASE_MIGRATE: "true"
            REDIS_URL: ${REDIS_URL}
            DOCKER_HOST: unix:///var/run/docker.sock
            AIO_BASE_WINGS_CONFIGURATION: /etc/calagopus-aio/wings-config.yml
            APP_DEBUG: "false"
            APP_LOG_DIRECTORY: /var/log/calagopus
            APP_PRIMARY: "true"
            APP_ENABLE_WINGS_PROXY: "true"
            APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
            APP_USE_DECRYPTION_CACHE: "true"
            APP_USE_INTERNAL_CACHE: "true"
            APP_DISABLE_EXTENSION_MANAGEMENT: "false"
        volumes:
            - calagopus_data:/var/lib/calagopus
            - calagopus_logs:/var/log/calagopus
            - calagopus_binaries:/app/binaries
            - calagopus_translations:/app/translations
            - calagopus_extensions:/app/extensions
            - calagopus_extension_migrations:/app/repo/database/extension-migrations
            - calagopus_wings_base:/etc/calagopus-aio
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/containers:/var/lib/docker/containers
            - /etc/calagopus-wings:/etc/calagopus-wings
            - /var/lib/calagopus-wings:/var/lib/calagopus-wings
            - /var/log/calagopus-wings:/var/log/calagopus-wings
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:8000/api/settings').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

volumes:
    calagopus_data:
    calagopus_logs:
    calagopus_binaries:
    calagopus_translations:
    calagopus_extensions:
    calagopus_extension_migrations:
    calagopus_wings_base:
