services:
    calagopus:
        image: ghcr.io/calagopus/panel:aio
        pull_policy: always
        restart: unless-stopped
        x-ports:
            - ${CALAGOPUS_HOST}:8000/https
            - ${CALAGOPUS_SFTP_PORT}:2022/tcp@host
        environment:
            TZ: ${TZ}
            PORT: "8000"
            DATABASE_URL: ${DATABASE_URL}
            DATABASE_MIGRATE: "true"
            REDIS_URL: ${REDIS_URL}
            DOCKER_HOST: unix:///var/run/docker.sock
            AIO_BASE_WINGS_CONFIGURATION: /etc/calagopus-aio/wings-config.yml
            CALAGOPUS_SYSTEM_ROOT_DIRECTORY: /var/lib/calagopus-wings/${CLOWDER_PREFIX}
            CALAGOPUS_SYSTEM_LOG_DIRECTORY: /var/log/calagopus-wings
            APP_DEBUG: "false"
            APP_LOG_DIRECTORY: /var/log/calagopus
            APP_PRIMARY: "true"
            APP_ENABLE_WINGS_PROXY: "true"
            APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
            APP_USE_DECRYPTION_CACHE: "true"
            APP_USE_INTERNAL_CACHE: "true"
        volumes:
            - calagopus_data:/var/lib/calagopus
            - calagopus_logs:/var/log/calagopus
            - calagopus_wings_base:/etc/calagopus-aio
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/containers:/var/lib/docker/containers
            - /etc/calagopus-wings/${CLOWDER_PREFIX}:/etc/calagopus-wings
            - /var/lib/calagopus-wings/${CLOWDER_PREFIX}:/var/lib/calagopus-wings/${CLOWDER_PREFIX}
            - /var/log/calagopus-wings/${CLOWDER_PREFIX}:/var/log/calagopus-wings
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/api/settings"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

volumes:
    calagopus_data:
    calagopus_logs:
    calagopus_wings_base:
