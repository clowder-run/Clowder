services:
    seerr:
        image: ghcr.io/seerr-team/seerr:latest
        pull_policy: always
        init: true
        restart: unless-stopped
        x-ports:
            - ${SEERR_HOST}:5055/https
        environment:
            TZ: ${TZ}
            PORT: "5055"
        volumes:
            - seerr_config:/app/config
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://127.0.0.1:5055/api/v1/settings/public",
                ]
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 20s

volumes:
    seerr_config:
