services:
    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        pull_policy: always
        restart: unless-stopped
        x-ports:
            - ${SONARR_HOST}:8989/https
        environment:
            PUID: ${MEDIA_UID}
            PGID: ${MEDIA_GID}
            TZ: ${TZ}
        volumes:
            - sonarr_config:/config
            - ${MEDIA_PATH}:/media
            - ${DOWNLOADS_PATH}:/downloads
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    sonarr_config:
