services:
    radarr:
        image: lscr.io/linuxserver/radarr:latest
        pull_policy: always
        restart: unless-stopped
        x-ports:
            - ${RADARR_HOST}:7878/https
        environment:
            PUID: ${MEDIA_UID}
            PGID: ${MEDIA_GID}
            TZ: ${TZ}
        volumes:
            - radarr_config:/config
            - ${MEDIA_PATH}:/media
            - ${DOWNLOADS_PATH}:/downloads
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    radarr_config:
