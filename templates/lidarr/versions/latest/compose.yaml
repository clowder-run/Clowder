services:
    lidarr:
        image: lscr.io/linuxserver/lidarr:latest
        pull_policy: always
        restart: unless-stopped
        x-ports:
            - ${LIDARR_HOST}:8686/https
        environment:
            PUID: ${MEDIA_UID}
            PGID: ${MEDIA_GID}
            TZ: ${TZ}
        volumes:
            - lidarr_config:/config
            - ${MEDIA_PATH}:/media
            - ${DOWNLOADS_PATH}:/downloads
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8686/ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    lidarr_config:
